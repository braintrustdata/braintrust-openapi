name: Validate OpenAPI spec

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate JSON spec structure
        run: |
          jq -e '(.openapi | type == "string" and startswith("3.")) and
            (.paths | type == "object" and length > 0)' openapi/spec.json >/dev/null

      - name: Validate SDK registry
        run: |
          jq -e '.repositories | type == "array" and length > 0 and
            length == (unique | length) and
            all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9_.-]*$"))' \
            .github/sdk-consumers.json >/dev/null
